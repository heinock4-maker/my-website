<!DOCTYPE html>
<html>
  <head>
    <title>Heinock - Urban Planning</title>
    <style>
      /* ---------- Light mode (default) ---------- */
      body {
        font-family: Georgia, serif;
        background-color: #d9e2dd;
        color: #1a1a1a;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        color: #0b7a1f;
      }
      h2 {
        color: #c0270f;
      }
      h3 {
        color: #2a1a8a;
      }
      li {
        margin-bottom: 8px;
      }
      a {
        color: #1f4e3d;
        font-weight: bold;
      }
      a:hover {
        color: #c0392b;
      }
      button {
        background-color: #1f4e3d;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 20px;
        margin-right: 10px;
      }
      button:hover {
        background-color: #0b7a1f;
      }

      /* ---------- Dark mode ---------- */
      body.dark {
        background-color: #0b4d33;
        color: #f2f2f2;
      }
      body.dark h1 {
        color: #6fe07f;
      }
      body.dark h2 {
        color: #ff8a76;
      }
      body.dark h3 {
        color: #a9a0ff;
      }
      body.dark a {
        color: #9be0c0;
      }
      body.dark a:hover {
        color: #ffffff;
      }
      body.dark button {
        background-color: #2f7a57;
      }
    </style>
  </head>

  <body>
    <h1>Urban Planning, Land Governance</h1>
    <p>I help cities plan land use and manage urban growth.</p>

    <h2>Skills</h2>
    <ul>
      <li>Urban Design</li>
      <li>AutoCAD</li>
      <li>ArchiCAD</li>
      <li>GIS</li>
      <li>Land Administration</li>
    </ul>

    <h3>My Profiles</h3>
    <p>
      <a href="https://www.upwork.com">Upwork</a> |
      <a href="https://www.linkedin.com">LinkedIn</a>
    </p>

    <button onclick="sayHello()">Contact me</button>
    <button onclick="toggleDark()">🌙 Dark / Light</button>
    <p id="message"></p>

    <script>
      // Shows a message when "Contact me" is clicked
      function sayHello() {
        document.getElementById("message").innerText =
          "Learning Computer Programming With My Friend Claude 👋";
      }

      // Switches between light and dark mode
      function toggleDark() {
        document.body.classList.toggle("dark");
      }
    </script>
  </body>
</html>
